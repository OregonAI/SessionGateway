# CI runs the same gate as local work (.github/CLAUDE.md), with its test step sharded. The
# supply-chain checks are separate jobs, so a new advisory fails its own job and not the gate.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate is three kinds of job. `static` runs every step of `npm run check` except the tests, once.
  # `test` runs the tests split over parallel jobs, one per matrix entry (Vitest's --shard: each test file runs in
  # exactly one). `check`, named as it always was, is the one result that branch rules and humans read:
  # it fails when `static` or any shard did not succeed. The suite alone took 18 minutes in one job.
  static:
    name: npm run check (all steps but the tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      # The embedding model is pinned by src/packages/embedder/data/model-lock.json and kept out of the
      # repository. The cache is keyed on the lock, so a new revision or hash misses it and model:fetch
      # downloads the files again; on a hit model:fetch checks the files and sends no request.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: model-${{ hashFiles('src/packages/embedder/data/model-lock.json') }}
      - run: npm run model:fetch
      - run: npm run check:static

  test:
    name: tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      # The embedding model is pinned by src/packages/embedder/data/model-lock.json and kept out of the
      # repository. The cache is keyed on the lock, so a new revision or hash misses it and model:fetch
      # downloads the files again; on a hit model:fetch checks the files and sends no request.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/models
          key: model-${{ hashFiles('src/packages/embedder/data/model-lock.json') }}
      - run: npm run model:fetch
      - run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [static, test]
    if: ${{ !cancelled() }}
    steps:
      - name: Every step and every shard passed
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "static: $STATIC_RESULT, tests (all shards): $TEST_RESULT"
          if [ "$STATIC_RESULT" != "success" ] || [ "$TEST_RESULT" != "success" ]; then
            echo "check FAILED"
            exit 1
          fi

  audit-signatures:
    name: npm audit signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm audit signatures

  audit:
    name: npm audit (production, high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm audit --omit=dev --audit-level=high

  licenses:
    name: licence allowlist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run license:check

  # A build-only check of the Dockerfile (ticket #25): no push, no registry login, no secrets. The build needs the
  # network (the npm registry for `npm ci`, huggingface.co for the pinned model, Docker Hub for the base image).
  # DOCKER_BUILDKIT=0 selects the legacy builder, as on the deploy box, which has no buildx.
  image:
    name: docker build (legacy builder)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build -t session-gateway:ci .
      # Offline smoke tests of the built image: the model is in it, and with no database the server refuses to
      # start with its own message. Nothing here reaches OLIS.
      - name: The model is in the image
        run: docker run --rm --entrypoint node session-gateway:ci -e "require('fs').accessSync('/app/model/config.json')"
      - name: The server refuses to start without a database
        run: |
          set +e
          output=$(docker run --rm -e SESSION_KEY=2026R1 -e OLIS_BASE_URL=https://olis.invalid/odata \
            -e DATABASE_PATH=/nonexistent/index.db session-gateway:ci 2>&1)
          status=$?
          echo "$output"
          [ "$status" -ne 0 ] && echo "$output" | grep -q "does not exist: the ingest worker creates it"
