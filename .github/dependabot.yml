# Weekly updates for npm, GitHub Actions and Docker, minor and patch grouped into one PR each (npm and Actions). The cooldown
# matches .npmrc's min-release-age (14 days); security updates skip the cooldown (.github/CLAUDE.md).
# Docker watches the Dockerfile's pinned node image (ticket #25); it skips a new major, since package.json's
# engines say <27.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
